version: '3.8'

services:
  agisfl-backend:
    build: .
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - JWT_SECRET=${JWT_SECRET:-your-secure-jwt-secret}
      - DATABASE_URL=postgresql://agisfl:secure_password@postgres:5432/agisfl
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=agisfl
      - POSTGRES_USER=agisfl
      - POSTGRES_PASSWORD=secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  postgres_data: