<!-- System Monitoring Icon -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="3" y="4" width="18" height="12" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="3" y1="8" x2="21" y2="8" stroke="currentColor" stroke-width="1"/>
  
  <!-- CPU indicator -->
  <rect x="5" y="10" width="2" height="4" fill="currentColor" opacity="0.8"/>
  <rect x="8" y="11" width="2" height="3" fill="currentColor" opacity="0.6"/>
  <rect x="11" y="9" width="2" height="5" fill="currentColor" opacity="0.9"/>
  <rect x="14" y="12" width="2" height="2" fill="currentColor" opacity="0.4"/>
  <rect x="17" y="10" width="2" height="4" fill="currentColor" opacity="0.7"/>
  
  <!-- Status lights -->
  <circle cx="5" cy="6" r="0.5" fill="#22c55e"/>
  <circle cx="7" cy="6" r="0.5" fill="#eab308"/>
  <circle cx="9" cy="6" r="0.5" fill="#ef4444"/>
  
  <!-- Monitor stand -->
  <path d="M10 16V18H14V16" stroke="currentColor" stroke-width="2"/>
  <path d="M8 18H16" stroke="currentColor" stroke-width="2"/>
</svg>
