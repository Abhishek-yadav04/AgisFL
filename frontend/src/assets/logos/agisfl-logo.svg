<!-- AgisFL Enterprise Logo - Enhanced -->
<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Enhanced Main logo shape with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:currentColor;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:currentColor;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:currentColor;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="neuralGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:currentColor;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:currentColor;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Main logo shape -->
  <circle cx="20" cy="20" r="16" stroke="url(#logoGradient)" stroke-width="2.5" fill="none"/>
  <circle cx="20" cy="20" r="10" stroke="url(#logoGradient)" stroke-width="1.5" fill="none" opacity="0.8"/>
  <circle cx="20" cy="20" r="5" stroke="url(#logoGradient)" stroke-width="1" fill="none" opacity="0.6"/>
  <circle cx="20" cy="20" r="2" fill="currentColor"/>

  <!-- Enhanced Neural network connections -->
  <circle cx="8" cy="8" r="1.5" fill="currentColor" opacity="0.7"/>
  <circle cx="32" cy="8" r="1.5" fill="currentColor" opacity="0.7"/>
  <circle cx="8" cy="32" r="1.5" fill="currentColor" opacity="0.7"/>
  <circle cx="32" cy="32" r="1.5" fill="currentColor" opacity="0.7"/>
  <circle cx="20" cy="8" r="1" fill="currentColor" opacity="0.8"/>
  <circle cx="20" cy="32" r="1" fill="currentColor" opacity="0.8"/>
  <circle cx="8" cy="20" r="1" fill="currentColor" opacity="0.8"/>
  <circle cx="32" cy="20" r="1" fill="currentColor" opacity="0.8"/>

  <!-- Enhanced Connection lines -->
  <line x1="9.5" y1="9.5" x2="18.5" y2="18.5" stroke="url(#neuralGradient)" stroke-width="1.5"/>
  <line x1="30.5" y1="9.5" x2="21.5" y2="18.5" stroke="url(#neuralGradient)" stroke-width="1.5"/>
  <line x1="9.5" y1="30.5" x2="18.5" y2="21.5" stroke="url(#neuralGradient)" stroke-width="1.5"/>
  <line x1="30.5" y1="30.5" x2="21.5" y2="21.5" stroke="url(#neuralGradient)" stroke-width="1.5"/>
  <line x1="20" y1="10" x2="20" y2="18" stroke="url(#neuralGradient)" stroke-width="1"/>
  <line x1="20" y1="22" x2="20" y2="30" stroke="url(#neuralGradient)" stroke-width="1"/>
  <line x1="10" y1="20" x2="18" y2="20" stroke="url(#neuralGradient)" stroke-width="1"/>
  <line x1="22" y1="20" x2="30" y2="20" stroke="url(#neuralGradient)" stroke-width="1"/>

  <!-- Enhanced Text with better typography -->
  <text x="48" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="currentColor">AgisFL</text>
  <text x="48" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="currentColor" opacity="0.9">Enterprise</text>
</svg>
