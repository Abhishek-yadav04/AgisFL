<!-- Network Monitoring Icon -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="3" y="10" width="4" height="4" rx="1" stroke="currentColor" stroke-width="2" fill="currentColor" opacity="0.3"/>
  <rect x="10" y="6" width="4" height="4" rx="1" stroke="currentColor" stroke-width="2" fill="currentColor" opacity="0.3"/>
  <rect x="17" y="10" width="4" height="4" rx="1" stroke="currentColor" stroke-width="2" fill="currentColor" opacity="0.3"/>
  <rect x="10" y="16" width="4" height="4" rx="1" stroke="currentColor" stroke-width="2" fill="currentColor" opacity="0.3"/>
  
  <!-- Network connections -->
  <line x1="7" y1="12" x2="10" y2="10" stroke="currentColor" stroke-width="2"/>
  <line x1="14" y1="8" x2="17" y2="10" stroke="currentColor" stroke-width="2"/>
  <line x1="14" y1="10" x2="17" y2="12" stroke="currentColor" stroke-width="2"/>
  <line x1="12" y1="14" x2="12" y2="16" stroke="currentColor" stroke-width="2"/>
  
  <!-- Activity indicators -->
  <circle cx="5" cy="12" r="1" fill="white"/>
  <circle cx="12" cy="8" r="1" fill="white"/>
  <circle cx="19" cy="12" r="1" fill="white"/>
  <circle cx="12" cy="18" r="1" fill="white"/>
</svg>
