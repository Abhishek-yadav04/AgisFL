
# Redis Configuration for AgisFL
bind 127.0.0.1
port 6379
requirepass agisfl_redis_secure_password_2024
maxmemory 256mb
maxmemory-policy allkeys-lru

# Security settings
protected-mode yes
tcp-keepalive 300
timeout 0

# Logging
loglevel notice
logfile ""

# Persistence (optional for cache)
save ""
