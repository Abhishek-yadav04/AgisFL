version: '3.8'

# Minimal services for AgisFL Enterprise
# Start only Redis and PostgreSQL without the full application stack

services:
  # Redis Cache and Session Store
  redis:
    image: redis:7-alpine
    container_name: agisfl-redis-only
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agisfl-postgres-only
    restart: unless-stopped
    environment:
      POSTGRES_DB: agisfl
      POSTGRES_USER: agisfl_user
      POSTGRES_PASSWORD: AgisFL2024!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agisfl_user -d agisfl"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  redis_data:
  postgres_data: